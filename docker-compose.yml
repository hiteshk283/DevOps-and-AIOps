services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: insurance-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_insurance_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - insurance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: insurance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_insurance_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - insurance-network
    restart: unless-stopped

  # 3. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: insurance-grafana
    ports:
      - "3007:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_insurance_data:/var/lib/grafana
    networks:
      - insurance-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # 4. Auth Service
  auth:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile
    container_name: insurance-auth
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - JWT_SECRET=health-insurance-secret-key-2026
    networks:
      - insurance-network
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Policy Service
  policy-service:
    build:
      context: ./backend/services/policy-service
      dockerfile: Dockerfile
    container_name: insurance-policy-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=policies_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
    networks:
      - insurance-network
    depends_on:
      postgres:
        condition: service_healthy

  # 6. Claim Service
  claim-service:
    build:
      context: ./backend/services/claim-service
      dockerfile: Dockerfile
    container_name: insurance-claim-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=claims_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
    networks:
      - insurance-network
    depends_on:
      postgres:
        condition: service_healthy

  # 7. Member Service
  member-service:
    build:
      context: ./backend/services/member-service
      dockerfile: Dockerfile
    container_name: insurance-member-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=members_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
    networks:
      - insurance-network
    depends_on:
      postgres:
        condition: service_healthy

  # 8. Hospital Network Service
  hospital-service:
    build:
      context: ./backend/services/hospital-service
      dockerfile: Dockerfile
    container_name: insurance-hospital-service
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=hospitals_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
    networks:
      - insurance-network
    depends_on:
      postgres:
        condition: service_healthy

  # 9. Billing & Payments Service
  billing-service:
    build:
      context: ./backend/services/billing-service
      dockerfile: Dockerfile
    container_name: insurance-billing-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=billing_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - AWS_S3_KAFKA_BUCKET=healthshield-kafka-events-794558722040
    networks:
      - insurance-network
    depends_on:
      postgres:
        condition: service_healthy

  # 10. Document Vault & Consent Service
  document-service:
    build:
      context: ./backend/services/document-service
      dockerfile: Dockerfile
    container_name: insurance-document-service
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=documents_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - AWS_S3_DOCUMENTS_BUCKET=healthshield-documents-794558722040
    networks:
      - insurance-network
    depends_on:
      postgres:
        condition: service_healthy

  # 11. Support & Jira Service Desk
  support-service:
    build:
      context: ./backend/services/support-service
      dockerfile: Dockerfile
    container_name: insurance-support-service
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=support_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - JIRA_PROJECT_KEY=HS
    networks:
      - insurance-network
    depends_on:
      postgres:
        condition: service_healthy

  # 12. API Gateway
  gateway:
    build:
      context: ./backend/services/gateway
      dockerfile: Dockerfile
    container_name: insurance-gateway
    ports:
      - "3001:3001"
    environment:
      - GATEWAY_PORT=3001
      - AUTH_SERVICE_URL=http://auth:3002
      - POLICIES_SERVICE_URL=http://policy-service:3003
      - CLAIMS_SERVICE_URL=http://claim-service:3004
      - MEMBERS_SERVICE_URL=http://member-service:3005
      - BILLING_SERVICE_URL=http://billing-service:3006
      - HOSPITALS_SERVICE_URL=http://hospital-service:3008
      - DOCUMENTS_SERVICE_URL=http://document-service:3009
      - SUPPORT_SERVICE_URL=http://support-service:3010
      - AIOPS_SERVICE_URL=http://aiops-assistant:3011
    networks:
      - insurance-network
    depends_on:
      - auth
      - policy-service
      - claim-service
      - member-service
      - hospital-service
      - billing-service
      - document-service
      - support-service

  # 13. AIOps Multi-Agent Swarm (FastAPI + Streamlit Console)
  aiops-assistant:
    build:
      context: ./aiops-assistant
      dockerfile: Dockerfile
    container_name: insurance-aiops-swarm
    ports:
      - "3011:3011"
      - "8501:8501"
    environment:
      - PORT=3011
      - PROMETHEUS_URL=http://prometheus:9090
      - GATEWAY_URL=http://gateway:3001
      - POLICY_SERVICE_URL=http://policy-service:3003
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - K8S_NAMESPACE=kumarh5149-dev
    networks:
      - insurance-network
    depends_on:
      - gateway
      - prometheus
      - postgres

  # 14. Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insurance-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
    networks:
      - insurance-network
    depends_on:
      - gateway

networks:
  insurance-network:
    driver: bridge

volumes:
  postgres_insurance_data:
  prometheus_insurance_data:
  grafana_insurance_data:

# ==============================================================================
# OPENSHIFT SECRETS TEMPLATE
# Run: oc apply -f secrets.yml (after replacing placeholders)
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: healthshield-secrets
  namespace: kumarh5149-dev
type: Opaque
stringData:
  # Database Credentials
  DB_USER: "postgres"
  DB_PASSWORD: "postgres123"

  # JWT Secret
  JWT_SECRET: "health-insurance-secret-key-2026"

  # AWS S3 Storage Buckets (Created via Terraform)
  AWS_S3_KAFKA_BUCKET: "healthshield-kafka-events-794558722040"
  AWS_S3_DOCUMENTS_BUCKET: "healthshield-documents-794558722040"

  # AWS IAM Credentials for Kafka S3 Sink Connector & Document Service
  # (Output by Terraform module.iam)
  AWS_ACCESS_KEY_ID: "YOUR_TERRAFORM_IAM_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "YOUR_TERRAFORM_IAM_SECRET_KEY"

  # Jira Service Management (JSM) Credentials
  JIRA_BASE_URL: "https://your-domain.atlassian.net"
  JIRA_USER_EMAIL: "admin@yourcompany.com"
  JIRA_API_TOKEN: "YOUR_ATLASSIAN_API_TOKEN"
  JIRA_PROJECT_KEY: "HS"

  # Splunk HTTP Event Collector (HEC) & Grafana Loki
  LOKI_PUSH_URL: "http://loki:3100/loki/api/v1/push"
  SPLUNK_HEC_URL: "https://your-splunk-host:8088/services/collector"
  SPLUNK_HEC_TOKEN: "YOUR_SPLUNK_HEC_TOKEN"
  SPLUNK_INDEX: "healthshield_logs"

  # Google Gemini / Antigravity AIOps Multi-Agent Swarm Credentials
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
  GEMINI_MODEL: "gemini-2.5-flash"
  GEMINI_FLASH_MODEL: "gemini-2.5-flash"


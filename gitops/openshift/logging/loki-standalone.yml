apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  ports:
    - name: http
      port: 3100
      targetPort: 3100
  selector:
    app: loki
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          args:
            - "-config.file=/etc/loki/local-config.yaml"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          ports:
            - containerPort: 3100
              name: http
          volumeMounts:
            - name: loki-storage
              mountPath: /loki
            - name: tmp-storage
              mountPath: /tmp
      volumes:
        - name: loki-storage
          emptyDir: {}
        - name: tmp-storage
          emptyDir: {}

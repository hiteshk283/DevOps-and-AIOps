# ==============================================================================
# OPENSHIFT CLUSTER IP SERVICES FOR ALL MICROSERVICES
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: frontend
---

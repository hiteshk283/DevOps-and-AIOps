---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-service
  template:
    metadata:
      labels:
        app: support-service
    spec:
      containers:
        - name: support-service
          image: 794558722040.dkr.ecr.us-east-1.amazonaws.com/support-service:latest
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 3010
          env:
            - name: PORT
              value: "3010"
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "support_db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: DB_PASSWORD
            - name: JIRA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: JIRA_BASE_URL
                  optional: true
            - name: JIRA_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: JIRA_USER_EMAIL
                  optional: true
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: JIRA_API_TOKEN
                  optional: true
            - name: SPLUNK_HEC_URL
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: SPLUNK_HEC_URL
                  optional: true
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: SPLUNK_HEC_TOKEN
                  optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 794558722040.dkr.ecr.us-east-1.amazonaws.com/frontend:latest
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_API_URL
              value: "/api"

    spec:
      containers:
        - name: billing-service
          image: 794558722040.dkr.ecr.us-east-1.amazonaws.com/billing-service:latest
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 3006
          env:
            - name: PORT
              value: "3006"
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "billing_db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: DB_PASSWORD
            - name: AWS_S3_KAFKA_BUCKET
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: AWS_S3_KAFKA_BUCKET
---
apiVersion: apps/v1
kind: Deployment

            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "documents_db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: DB_PASSWORD
            - name: AWS_S3_DOCUMENTS_BUCKET
              valueFrom:
                secretKeyRef:

# ==============================================================================
# OPENSHIFT DEPLOYMENTS FOR ALL HEALTHSHIELD MICROSERVICES
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 794558722040.dkr.ecr.us-east-1.amazonaws.com/gateway:latest
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 3001
          env:
            - name: GATEWAY_PORT
              value: "3001"
            - name: AUTH_SERVICE_URL
              value: "http://auth:3002"
            - name: POLICIES_SERVICE_URL
              value: "http://policy-service:3003"
            - name: CLAIMS_SERVICE_URL
              value: "http://claim-service:3004"
            - name: MEMBERS_SERVICE_URL
              value: "http://member-service:3005"
            - name: BILLING_SERVICE_URL
              value: "http://billing-service:3006"
            - name: HOSPITALS_SERVICE_URL
              value: "http://hospital-service:3008"
            - name: DOCUMENTS_SERVICE_URL
              value: "http://document-service:3009"
            - name: SUPPORT_SERVICE_URL
              value: "http://support-service:3010"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-service
  template:
    metadata:
      labels:
        app: hospital-service
    spec:
      containers:
        - name: hospital-service
          image: 794558722040.dkr.ecr.us-east-1.amazonaws.com/hospital-service:latest
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 3008
          env:
            - name: PORT
              value: "3008"
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "hospitals_db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthshield-secrets
                  key: DB_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:

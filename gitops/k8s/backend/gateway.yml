apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: kumarh5149-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 794558722040.dkr.ecr.us-east-1.amazonaws.com/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: GATEWAY_PORT
              value: "3001"
            - name: AUTH_SERVICE_URL
              value: "http://auth:3002"
            - name: POLICIES_SERVICE_URL
              value: "http://policy-service:3003"
            - name: CLAIMS_SERVICE_URL
              value: "http://claim-service:3004"
            - name: MEMBERS_SERVICE_URL
              value: "http://member-service:3005"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: kumarh5149-dev
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP

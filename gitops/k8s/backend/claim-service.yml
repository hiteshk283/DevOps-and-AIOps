apiVersion: apps/v1
kind: Deployment
metadata:
  name: claim-service
  namespace: health-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claim-service
  template:
    metadata:
      labels:
        app: claim-service
    spec:
      containers:
        - name: claim-service
          image: 794558722040.dkr.ecr.us-east-1.amazonaws.com/claim-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: claims_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: insurance-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insurance-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claim-service
  namespace: health-insurance
  labels:
    app: claim-service
spec:
  selector:
    app: claim-service
  ports:
    - name: http
      protocol: TCP
      port: 3004
      targetPort: 3004
  type: ClusterIP

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: healthshield-services
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kumarh5149-dev
  selector:
    matchLabels:
      app: gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s

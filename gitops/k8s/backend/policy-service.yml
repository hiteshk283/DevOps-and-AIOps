apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  namespace: kumarh5149-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
    spec:
      containers:
        - name: policy-service
          image: 794558722040.dkr.ecr.us-east-1.amazonaws.com/policy-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: policies_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: insurance-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insurance-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  namespace: kumarh5149-dev
  labels:
    app: policy-service
spec:
  selector:
    app: policy-service
  ports:
    - name: http
      protocol: TCP
      port: 3003
      targetPort: 3003
  type: ClusterIP

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: health-insurance
  labels:
    app: postgres
data:
  10-create-databases.sh: |
    #!/bin/bash
    set -e

    create_database() {
        local db_name=$1
        echo "Creating database: $db_name"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
            CREATE DATABASE $db_name;
            GRANT ALL PRIVILEGES ON DATABASE $db_name TO $POSTGRES_USER;
    EOSQL
    }

    create_database auth_db
    create_database policies_db
    create_database claims_db
    create_database members_db

    echo "All Health Insurance databases created successfully!"


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthshield
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hiteshk283/DevOps-and-AIOps.git'
    targetRevision: main
    path: gitops
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kumarh5149-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true


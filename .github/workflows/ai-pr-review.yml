name: AI Agent PR Code Review, Jira Tracking & Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-agent-review-and-merge:
    name: Gemini AI Code Review & Jira Lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent Dependencies
        run: |
          pip install requests python-dotenv

      - name: Run AI Reviewer, Open Jira Ticket & Auto-Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JIRA_BASE_URL: "https://kumarh5149.atlassian.net"
          JIRA_USER_EMAIL: "kumarh5149@gmail.com"
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: "OPS"
        run: |
          python aiops-assistant/tools/github_pr_reviewer.py

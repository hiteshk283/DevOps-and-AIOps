# ------------------------------------------------------------------------------
# Observability & Integrations
# ------------------------------------------------------------------------------
integrations:
  jira:
    baseUrl: "https://kumarh5149.atlassian.net"
    email: "kumarh5149@gmail.com"
  loki:
    pushUrl: "http://loki:3100/loki/api/v1/push"
  s3:
    kafkaBucket: "healthshield-kafka-events-794558722040"
    documentsBucket: "healthshield-documents-794558722040"

# ------------------------------------------------------------------------------
# OpenShift Route Exposure
# ------------------------------------------------------------------------------
routes:
  enabled: true
  termination: edge

# ------------------------------------------------------------------------------
# Secrets Configuration
# ------------------------------------------------------------------------------
secrets:
  create: false
  existingSecret: healthshield-secrets
